<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>🎮 Чат с кейсами</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>
    <div class="app">
        <!-- Сервера -->
        <div class="servers">
            <div class="server-icon active"><i class="fas fa-hashtag"></i></div>
            <div class="server-divider"></div>
            <div class="server-icon"><i class="fas fa-gamepad"></i></div>
            <div class="server-icon"><i class="fas fa-gem"></i></div>
            <div class="server-icon"><i class="fas fa-plus"></i></div>
        </div>

        <!-- Каналы -->
        <div class="channels" id="channelsPanel">
            <div class="channel-header">
                <div class="server-name">🎮 Игровой сервер <i class="fas fa-chevron-down"></i></div>
            </div>
            <div class="channel-category"><i class="fas fa-chevron-down"></i> Текстовые каналы</div>
            <div class="channel-item active"><i class="fas fa-hashtag"></i> общий-чат <span class="badge">5</span></div>
            <div class="channel-item"><i class="fas fa-hashtag"></i> кейсы <span class="badge">🔥</span></div>
            <div class="channel-item"><i class="fas fa-hashtag"></i> трейд</div>
            <div class="channel-category"><i class="fas fa-chevron-down"></i> Голосовые каналы</div>
            <div class="channel-item"><i class="fas fa-volume-up"></i> Общий голосовой</div>
            <div class="channel-item"><i class="fas fa-volume-up"></i> AFK</div>
        </div>

        <!-- Чат -->
        <div class="chat">
            <div class="chat-header">
                <div class="chat-info">
                    <button class="menu-toggle" id="menuToggle">
                        <i class="fas fa-bars"></i>
                    </button>
                    <i class="fas fa-hashtag" style="color:#949ba4;"></i>
                    <h3>общий-чат</h3>
                    <span class="online-status">
                        <i class="fas fa-circle"></i>
                        <span id="onlineCount">0</span> онлайн
                    </span>
                </div>
                <div class="chat-actions">
                    <i class="fas fa-user-plus"></i>
                    <i class="fas fa-search"></i>
                    <i class="fas fa-pin"></i>
                    <i class="fas fa-bell"></i>
                </div>
            </div>

            <div class="messages" id="messages"></div>

            <div class="input-area">
                <div class="input-wrapper">
                    <i class="fas fa-plus-circle"></i>
                    <input type="text" id="messageInput" placeholder="Напишите сообщение..." />
                    <div class="input-actions">
                        <button class="btn-case" id="caseBtn"><i class="fas fa-gift"></i> Кейс</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Модалка кейса -->
    <div class="case-result-overlay" id="caseResultOverlay">
        <div class="case-result-modal">
            <div class="item-icon" id="caseItemIcon">💎</div>
            <div class="item-name" id="caseItemName">Легендарный скин</div>
            <div class="item-rarity" id="caseItemRarity">Легендарный</div>
            <button class="close-btn" id="caseCloseBtn">Понятно!</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module" src="js/app.js"></script>
</body>
</html>
